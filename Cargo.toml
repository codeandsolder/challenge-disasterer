[package]
name = "challenge-disasterer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = ["dep:bytemuck", "dep:cudarc", "dep:wgpu", "challenge-solvers/gpu", "challenge-solvers/compare-64bit"]

[dependencies]
anyhow = "1"
argon2 = { path = "vendor/argon2-fast" }
anubis-argon2 = { path = "crates/anubis-argon2" }
altcha = { version = "=1.1.0", features = ["argon2", "scrypt"] }
axum = "0.8"
bytemuck = { version = "1", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13040"], optional = true }
hex = "0.4"
itoa = "1"
hashwx = { workspace = true }
num-bigint = "0.5"
num_cpus = "1.17"
pbkdf2 = "0.13"
challenge-solvers = { path = "crates/challenge-solvers", default-features = true, features = ["all-challenges"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
scrypt = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30.0.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3

[lints]
workspace = true

[workspace]
members = ["crates/anubis-argon2", "crates/challenge-solvers", "tools/anubis-e2e", "tools/mcaptcha-e2e", "tools/solver-matrix", "tools/wasm-simd128-bench", "tools/simd-width-bench"]
resolver = "3"
exclude = ["vendor/argon2-fast"]

[workspace.metadata.rust-skills2]
allow-test-panics = true
allow-test-panics-reason = "Large inherited protocol solver test suite; production and examples remain strict"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
hashwx = { git = "https://github.com/codeandsolder/hashwx-rs", rev = "9c69f0f8a30d4528c46c39ce1972eea1cde8e177", default-features = false, features = ["native", "hashx"] }
