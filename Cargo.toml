[package]
name = "challenge-disasterer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = ["dep:bytemuck", "dep:cudarc", "dep:wgpu", "pow-buster/gpu", "pow-buster/compare-64bit"]

[dependencies]
anyhow = "1"
argon2 = { path = "crates/argon2-fast" }
axum = "0.8"
bytemuck = { version = "1", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13040"], optional = true }
hex = "0.4"
hashx08 = { package = "hashx", version = "0.8" }
pow-buster = { package = "challenge-pow-core", path = "crates/pow-core", default-features = true, features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30.0.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[workspace]
members = ["crates/pow-core", "tools/anubis-e2e", "tools/mcaptcha-e2e", "tools/solver-matrix", "tools/wasm-simd128-bench"]
resolver = "3"
exclude = ["crates/argon2-fast"]
