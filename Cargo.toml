[package]
name = "challenge-disasterer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
pow-buster = { git = "https://github.com/eternal-flame-AD/pow-buster", rev = "d359adb3a692", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0.1"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
