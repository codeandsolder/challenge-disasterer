[package]
name = "challenge-disasterer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = ["dep:bytemuck", "dep:wgpu"]

[dependencies]
anyhow = "1"
axum = "0.8"
bytemuck = { version = "1", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"] }
pow-buster = { git = "https://github.com/codeandsolder/pow-buster-imp", rev = "20bd176437b22b5a92ec2c5d5a137910c81000b2", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30.0.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
