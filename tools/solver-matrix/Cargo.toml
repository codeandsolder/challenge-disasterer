[package]
name = "challenge-disasterer-solver-matrix"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["gpu"]
gpu = ["challenge-solvers/gpu"]

[dependencies]
argon2 = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "7ec936e6c8d15a5d82a8f5184d3dee1a7463adba" }
hashwx = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5"
challenge-solvers = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "7ec936e6c8d15a5d82a8f5184d3dee1a7463adba", features = ["all-challenges", "compare-64bit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
