[package]
name = "challenge-disasterer-solver-matrix"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pow-core = { package = "challenge-pow-core", path = "../../crates/pow-core", features = ["gpu", "json", "compare-64bit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
