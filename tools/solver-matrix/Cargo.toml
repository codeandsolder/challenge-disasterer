[package]
name = "challenge-disasterer-solver-matrix"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["gpu"]
gpu = ["challenge-solvers/gpu"]

[dependencies]
argon2 = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "d6ea9ced865f29ac275aa9d0bbe6cb9c6bf9509d" }
hashwx = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5"
challenge-solvers = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "3ab807d5d32c25755e571c165b07cece28c3b61f", features = ["all-challenges", "compare-64bit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
pbkdf2 = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
