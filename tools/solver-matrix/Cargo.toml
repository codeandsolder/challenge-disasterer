[package]
name = "challenge-disasterer-solver-matrix"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["gpu"]
gpu = ["challenge-solvers/gpu", "dep:rayon", "dep:scrypt"]

[dependencies]
argon2 = "0.6.0"
hashwx = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5"
challenge-solvers = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "ccc94fa3603f8abd7219dd784b049caf5f5fa536", features = ["all-challenges", "compare-64bit", "internals"] }
challenge-protocols = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "ccc94fa3603f8abd7219dd784b049caf5f5fa536", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
pbkdf2 = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

rayon = { version = "1.12", optional = true }
scrypt = { version = "0.12", optional = true }

[lints]
workspace = true
