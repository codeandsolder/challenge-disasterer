[package]
name = "challenge-disasterer-solver-matrix"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["gpu"]
gpu = ["challenge-solvers/gpu"]

[dependencies]
argon2 = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "3922ee679872710f67e97c9c89155f812a5dc2bd" }
hashwx = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5"
challenge-solvers = { git = "https://github.com/codeandsolder/challenge-solvers", rev = "3922ee679872710f67e97c9c89155f812a5dc2bd", features = ["all-challenges", "compare-64bit", "internals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
pbkdf2 = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rayon = "1.12"
scrypt = "0.12"

[lints]
workspace = true
