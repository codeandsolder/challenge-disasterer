[package]
name = "challenge-disasterer-fixture-runner"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rustix = { version = "1.1", features = ["process"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"

[lints]
workspace = true
