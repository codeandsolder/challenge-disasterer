[package]
name = "challenge-disasterer-preexisting-baseline"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
current = { package = "challenge-pow-core", path = "../../crates/pow-core", default-features = true, features = ["compare-64bit"] }
legacy = { package = "pow-buster", git = "https://github.com/eternal-flame-AD/pow-buster.git", rev = "d359adb3a692ba6be27fc5c1d5efdbbd7439434d", default-features = false, features = ["std", "runtime-dispatch", "compare-64bit"] }
