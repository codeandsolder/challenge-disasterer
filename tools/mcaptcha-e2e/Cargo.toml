[package]
name = "challenge-disasterer-mcaptcha-e2e"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
mcaptcha_pow_sha256 = "0.6"
# v0.1.2 selects wincode 0.6, incompatible with upstream mCaptcha 0.6 wincode 0.4.
serde-wincode = "=0.1.0"
wincode = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
