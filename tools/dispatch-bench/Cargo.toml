[package]
name = "challenge-disasterer-dispatch-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["typed"]
typed = []
erased = []

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
current = { package = "challenge-solvers", git = "https://github.com/codeandsolder/challenge-solvers", rev = "f22273d7f8a250c8a95eb1c06e816f23af82a18f", default-features = true, features = ["compare-64bit"] }
