name: Source quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
