name: Source quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
