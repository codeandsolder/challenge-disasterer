name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-app:
    name: Application Rust (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@e7e29ed9109c2450c2a9f1f0310de9bd0000de3d # main
    with:
      rust-toolchain: "nightly-2026-11-10"
      timeout-minutes: 15
      command: |
        ./tools/ci/check-rust-toolchain.sh
        cargo test --locked -p challenge-disasterer --all-features

  rust-tools:
    name: Rust tools (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@e7e29ed9109c2450c2a9f1f0310de9bd0000de3d # main
    with:
      rust-toolchain: "nightly-2026-11-10"
      rust-components: "rustfmt"
      timeout-minutes: 15
      command: |
        ./tools/ci/check-rust-toolchain.sh
        cargo fmt --check
        cargo test --locked -p challenge-disasterer-anubis-e2e
        cargo test --locked -p challenge-disasterer-mcaptcha-e2e
        cargo test --locked -p challenge-disasterer-wasm-simd128-bench
        cargo test --locked -p challenge-disasterer-simd-width-bench

  rust-matrix:
    name: Solver matrix Rust (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@e7e29ed9109c2450c2a9f1f0310de9bd0000de3d # main
    with:
      rust-toolchain: "nightly-2026-11-10"
      timeout-minutes: 15
      command: |
        ./tools/ci/check-rust-toolchain.sh
        cargo test --locked -p challenge-disasterer-solver-matrix --all-features
