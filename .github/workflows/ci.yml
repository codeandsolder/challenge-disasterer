name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-app:
    name: Application Rust (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@87725346983e463348aeff6f1f7803bfddf46a3e # main
    with:
      rust-toolchain: "nightly-2026-11-03"
      timeout-minutes: 15
      command: |
        cargo test --locked -p challenge-disasterer --all-features

  rust-tools:
    name: Rust tools (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@87725346983e463348aeff6f1f7803bfddf46a3e # main
    with:
      rust-toolchain: "nightly-2026-11-03"
      rust-components: "rustfmt"
      timeout-minutes: 15
      command: |
        cargo fmt --check
        cargo test --locked -p challenge-disasterer-anubis-e2e
        cargo test --locked -p challenge-disasterer-mcaptcha-e2e
        cargo test --locked -p challenge-disasterer-wasm-simd128-bench
        cargo test --locked -p challenge-disasterer-simd-width-bench

  rust-matrix:
    name: Solver matrix Rust (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@87725346983e463348aeff6f1f7803bfddf46a3e # main
    with:
      rust-toolchain: "nightly-2026-11-03"
      timeout-minutes: 15
      command: |
        cargo test --locked -p challenge-disasterer-solver-matrix --all-features
