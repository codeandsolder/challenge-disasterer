name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install nightly-2026-10-08 --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add wasm32-wasip1 --toolchain nightly-2026-10-08

      - name: Set up Node for WASI SIMD128 tests
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Format
        run: cargo fmt --check

      - name: Validate vendored Argon2
        run: |
          cargo test --manifest-path crates/argon2-fast/Cargo.toml --all-features
          cargo clippy --manifest-path crates/argon2-fast/Cargo.toml --lib --all-features -- -D warnings
          cargo fmt --manifest-path crates/argon2-fast/Cargo.toml -- --check

      - name: Validate vendored Argon2 soft fallback
        env:
          CARGO_TARGET_DIR: target/argon2-soft
          RUSTFLAGS: --cfg argon2_backend="soft"
        run: cargo test --manifest-path crates/argon2-fast/Cargo.toml --all-features

      - name: Check vendored Argon2 MSRV
        env:
          CARGO_TARGET_DIR: target/argon2-msrv
        run: |
          rm -f crates/argon2-fast/Cargo.lock
          cargo +1.85.0 check --manifest-path crates/argon2-fast/Cargo.toml --all-features

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Test WASM SIMD128 backend
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ../../tools/wasm-wasi-runner.mjs
          NODE_NO_WARNINGS: 1
          RUSTFLAGS: -C target-feature=+simd128 -D warnings
        run: cargo test --locked --target wasm32-wasip1 -p challenge-pow-core --no-default-features --features std,compare-64bit

      - name: Benchmark WASM SIMD128 backend
        env:
          NODE_NO_WARNINGS: 1
          RUSTFLAGS: -C target-feature=+simd128 -D warnings
        run: |
          cargo build --locked --release --target wasm32-wasip1 -p challenge-disasterer-wasm-simd128-bench
          node tools/wasm-wasi-runner.mjs target/wasm32-wasip1/release/challenge-disasterer-wasm-simd128-bench.wasm 1120000

      - name: Clippy WASM SIMD128 backend
        env:
          RUSTFLAGS: -C target-feature=+simd128 -D warnings
        run: |
          cargo clippy --locked --target wasm32-wasip1 -p challenge-pow-core --no-default-features --features std,compare-64bit -- -D warnings
          cargo clippy --locked --target wasm32-wasip1 -p challenge-disasterer-wasm-simd128-bench -- -D warnings

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test CPU-only solver matrix build
        run: |
          cargo test --locked -p challenge-disasterer-solver-matrix --no-default-features
          cargo clippy --locked -p challenge-disasterer-solver-matrix --no-default-features -- -D warnings

      - name: Compile AVX-512-only test paths
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+avx512f -D warnings
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p challenge-pow-core --no-default-features --features std,compare-64bit --no-run
