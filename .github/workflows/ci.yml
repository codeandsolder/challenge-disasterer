name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-host:
    name: Host Rust (shared sccache)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@9be344b41c4c7e53f451d7ab1f66d7d9e7a9a6f4 # main
    with:
      rust-toolchain: "nightly-2026-11-02"
      rust-components: "clippy rustfmt"
      timeout-minutes: 30
      command: |
        cargo fmt --check
        cargo test --manifest-path vendor/argon2-fast/Cargo.toml --all-features
        cargo clippy --manifest-path vendor/argon2-fast/Cargo.toml --lib --all-features -- -D warnings
        cargo fmt --manifest-path vendor/argon2-fast/Cargo.toml -- --check
        CARGO_TARGET_DIR="$CARGO_TARGET_DIR/argon2-soft" RUSTFLAGS='--cfg argon2_backend="soft"' cargo test --manifest-path vendor/argon2-fast/Cargo.toml --all-features
        cargo test --locked --workspace --all-features
        cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo test --locked -p challenge-disasterer-solver-matrix --no-default-features
        cargo clippy --locked -p challenge-disasterer-solver-matrix --no-default-features -- -D warnings
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS='-C target-feature=+avx512f -D warnings' cargo test --locked --target x86_64-unknown-linux-gnu -p challenge-pow-core --no-default-features --features std,compare-64bit --no-run

  rust-portable:
    name: Portable/MSRV Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          cargo --version
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add wasm32-wasip1 aarch64-unknown-linux-gnu

      - name: Set up Node for WASI SIMD128 tests
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check vendored Argon2 MSRV
        env:
          CARGO_TARGET_DIR: target/argon2-msrv
        run: |
          rm -f vendor/argon2-fast/Cargo.lock
          cargo +1.85.0 check --manifest-path vendor/argon2-fast/Cargo.toml --all-features

      - name: Test portable Anubis Argon2 on WASI SIMD128
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ../../tools/wasm-wasi-runner.mjs
          NODE_NO_WARNINGS: 1
          RUSTFLAGS: -C target-feature=+simd128 -D warnings
        run: cargo test --locked --release --target wasm32-wasip1 -p anubis-argon2

      - name: Check portable Anubis Argon2 on AArch64
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --target aarch64-unknown-linux-gnu -p anubis-argon2

      - name: Test WASM SIMD128 backend
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ../../tools/wasm-wasi-runner.mjs
          NODE_NO_WARNINGS: 1
          RUSTFLAGS: -C target-feature=+simd128 -D warnings
        run: cargo test --locked --target wasm32-wasip1 -p challenge-pow-core --no-default-features --features std,compare-64bit

      - name: Benchmark WASM SIMD128 backend
        env:
          NODE_NO_WARNINGS: 1
          RUSTFLAGS: -C target-feature=+simd128 -D warnings
        run: |
          cargo build --locked --release --target wasm32-wasip1 -p challenge-disasterer-wasm-simd128-bench
          node tools/wasm-wasi-runner.mjs target/wasm32-wasip1/release/challenge-disasterer-wasm-simd128-bench.wasm 1120000

      - name: Clippy WASM SIMD128 backend
        env:
          RUSTFLAGS: -C target-feature=+simd128 -D warnings
        run: |
          cargo clippy --locked --target wasm32-wasip1 -p challenge-pow-core --no-default-features --features std,compare-64bit -- -D warnings
          cargo clippy --locked --target wasm32-wasip1 -p challenge-disasterer-wasm-simd128-bench -- -D warnings
