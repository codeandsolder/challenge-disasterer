name: Release portability

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  cpu-only:
    name: Pinned-nightly CPU-only service
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@c6fcb5f8920460c109ee87152506c3d97889ed4e # main
    with:
      rust-toolchain: "nightly-2026-11-03"
      validation-tier: release
      rustflags: ""
      timeout-minutes: 25
      command: |
        export CARGO_PROFILE_TEST_OPT_LEVEL=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_BUILD_JOBS=2
        cargo test --locked -p challenge-disasterer --no-default-features

  historical-baseline:
    name: Standalone benchmark tools (release-only)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@18397eb8f0bd8a76f90010a66a8519011f7992ca # main
    with:
      rust-toolchain: "nightly-2026-11-03"
      validation-tier: release
      rustflags: ""
      timeout-minutes: 15
      command: |
        export CARGO_BUILD_JOBS=2
        cargo test --locked --manifest-path tools/preexisting-baseline/Cargo.toml --all-targets
        # Compile each dispatch shape independently to catch conditional-codegen bugs.
        for dispatch_features in typed erased typed,erased; do
          cargo test --locked --manifest-path tools/dispatch-bench/Cargo.toml --no-default-features --features "$dispatch_features" --all-targets
        done
