name: Live protocol compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  altcha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Rust
        run: cargo --version
      - name: Verify against current ALTCHA (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-altcha-e2e.sh

  capjs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Rust
        run: cargo --version
      - name: Verify against current Cap.js (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-capjs-e2e.sh

  cerberus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
        upstream_ref: [dist, v0.4.9, v0.4.8, v0.4.7, v0.4.6, v0.4.5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Set up Rust
        run: cargo --version
      - name: Verify Cerberus ${{ matrix.upstream_ref }} (${{ matrix.implementation }})
        env:
          CERBERUS_REF: ${{ matrix.upstream_ref }}
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-cerberus-e2e.sh

  goaway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Set up Rust
        run: cargo --version
      - name: Verify against current go-away (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-goaway-e2e.sh

  haphash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
        difficulty: [4, 0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Rust
        run: cargo --version
      - name: Install HAProxy 3.2
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          sudo wget -qO /usr/share/keyrings/HAPROXY-key-community.asc https://pks.haproxy.com/linux/community/RPM-GPG-KEY-HAProxy
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/HAPROXY-key-community.asc] https://www.haproxy.com/download/haproxy/performance/ubuntu/ha32 noble main" | sudo tee /etc/apt/sources.list.d/haproxy.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y haproxy-awslc
      - name: Verify against current haphash HAProxy (${{ matrix.implementation }}, difficulty ${{ matrix.difficulty }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
          HAPHASH_DIFFICULTY: ${{ matrix.difficulty }}
        run: ./ci/live-haphash-e2e.sh

  linear:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: cargo --version
      - name: Verify against live Linear.pub gate
        run: ./ci/live-linear-e2e.sh

  mcaptcha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: cargo --version
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Verify against mCaptcha verifier (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-mcaptcha-e2e.sh
