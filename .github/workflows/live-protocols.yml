name: Live protocol compatibility

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Run only one provider's official compatibility cases (all by default)"
        required: true
        type: choice
        default: all
        options:
          - all
          - altcha
          - capjs
          - cerberus
          - goaway
          - haphash
          - linear
          - mcaptcha
  release:
    types: [published]
  schedule:
    - cron: "41 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  solver-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup canonical sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@835efeff3a1e617d8ecd40ed70b402a298d2481f # main

      - name: Build one CPU-only release executable
        run: cargo build --locked --release --no-default-features --bin challenge-disasterer

      - name: Upload exact-revision executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: target/release/challenge-disasterer
          if-no-files-found: error
          retention-days: 1

      - name: Finalize canonical sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@835efeff3a1e617d8ecd40ed70b402a298d2481f # main

  altcha:
    needs: solver-binary
    if: github.event_name != 'workflow_dispatch' || inputs.provider == 'all' || inputs.provider == 'altcha'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact-revision solver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-disasterer

      - name: Prepare solver executable
        run: |
          chmod +x "$RUNNER_TEMP/challenge-disasterer/challenge-disasterer"
          echo "CHALLENGE_SOLVER_BINARY=$RUNNER_TEMP/challenge-disasterer/challenge-disasterer" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Verify against current ALTCHA (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-altcha-e2e.sh

  capjs:
    needs: solver-binary
    if: github.event_name != 'workflow_dispatch' || inputs.provider == 'all' || inputs.provider == 'capjs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact-revision solver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-disasterer

      - name: Prepare solver executable
        run: |
          chmod +x "$RUNNER_TEMP/challenge-disasterer/challenge-disasterer"
          echo "CHALLENGE_SOLVER_BINARY=$RUNNER_TEMP/challenge-disasterer/challenge-disasterer" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Verify against current Cap.js (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-capjs-e2e.sh

  cerberus:
    needs: solver-binary
    if: github.event_name != 'workflow_dispatch' || inputs.provider == 'all' || inputs.provider == 'cerberus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
        upstream_ref: [dist, v0.4.9, v0.4.8, v0.4.7, v0.4.6, v0.4.5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact-revision solver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-disasterer

      - name: Prepare solver executable
        run: |
          chmod +x "$RUNNER_TEMP/challenge-disasterer/challenge-disasterer"
          echo "CHALLENGE_SOLVER_BINARY=$RUNNER_TEMP/challenge-disasterer/challenge-disasterer" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
      - name: Verify Cerberus ${{ matrix.upstream_ref }} (${{ matrix.implementation }})
        env:
          CERBERUS_REF: ${{ matrix.upstream_ref }}
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-cerberus-e2e.sh

  goaway:
    needs: solver-binary
    if: github.event_name != 'workflow_dispatch' || inputs.provider == 'all' || inputs.provider == 'goaway'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact-revision solver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-disasterer

      - name: Prepare solver executable
        run: |
          chmod +x "$RUNNER_TEMP/challenge-disasterer/challenge-disasterer"
          echo "CHALLENGE_SOLVER_BINARY=$RUNNER_TEMP/challenge-disasterer/challenge-disasterer" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
      - name: Verify against current go-away (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-goaway-e2e.sh

  haphash:
    needs: solver-binary
    if: github.event_name != 'workflow_dispatch' || inputs.provider == 'all' || inputs.provider == 'haphash'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
        difficulty: [4, 0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact-revision solver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-disasterer

      - name: Prepare solver executable
        run: |
          chmod +x "$RUNNER_TEMP/challenge-disasterer/challenge-disasterer"
          echo "CHALLENGE_SOLVER_BINARY=$RUNNER_TEMP/challenge-disasterer/challenge-disasterer" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Install HAProxy 3.2
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          sudo wget -qO /usr/share/keyrings/HAPROXY-key-community.asc https://pks.haproxy.com/linux/community/RPM-GPG-KEY-HAProxy
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/HAPROXY-key-community.asc] https://www.haproxy.com/download/haproxy/performance/ubuntu/ha32 noble main" | sudo tee /etc/apt/sources.list.d/haproxy.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y haproxy-awslc
      - name: Verify against current haphash HAProxy (${{ matrix.implementation }}, difficulty ${{ matrix.difficulty }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
          HAPHASH_DIFFICULTY: ${{ matrix.difficulty }}
        run: ./ci/live-haphash-e2e.sh

  linear:
    needs: solver-binary
    if: github.event_name != 'workflow_dispatch' || inputs.provider == 'all' || inputs.provider == 'linear'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact-revision solver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-disasterer

      - name: Prepare solver executable
        run: |
          chmod +x "$RUNNER_TEMP/challenge-disasterer/challenge-disasterer"
          echo "CHALLENGE_SOLVER_BINARY=$RUNNER_TEMP/challenge-disasterer/challenge-disasterer" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Verify against live Linear.pub gate
        run: ./ci/live-linear-e2e.sh

  mcaptcha:
    needs: solver-binary
    if: github.event_name != 'workflow_dispatch' || inputs.provider == 'all' || inputs.provider == 'mcaptcha'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        implementation: [auto, safe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download exact-revision solver
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: challenge-disasterer-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-disasterer

      - name: Prepare solver executable
        run: |
          chmod +x "$RUNNER_TEMP/challenge-disasterer/challenge-disasterer"
          echo "CHALLENGE_SOLVER_BINARY=$RUNNER_TEMP/challenge-disasterer/challenge-disasterer" >> "$GITHUB_ENV"

      - name: Setup canonical sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@835efeff3a1e617d8ecd40ed70b402a298d2481f # main
      - name: Set up Rust
        run: cargo --version
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Verify against mCaptcha verifier (${{ matrix.implementation }})
        env:
          CHALLENGE_IMPLEMENTATION: ${{ matrix.implementation }}
        run: ./ci/live-mcaptcha-e2e.sh

      - name: Finalize canonical sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@835efeff3a1e617d8ecd40ed70b402a298d2481f # main
