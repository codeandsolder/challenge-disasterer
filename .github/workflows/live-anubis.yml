name: Live Anubis compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  live-anubis-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out challenge-disasterer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup canonical sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@47a06568cde470da42ae67a93c8e63966cce1fce # main

      - name: Check out live Anubis main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TecharoHQ/anubis
          ref: main
          path: target/anubis-live
          fetch-depth: 1

      - name: Set up Go used by Anubis
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: target/anubis-live/go.mod
          cache-dependency-path: target/anubis-live/go.sum

      - name: Set up Node used by Anubis assets
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: target/anubis-live/package-lock.json

      - name: Set up Rust
        run: |
          cargo --version
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0

      - name: Install Anubis asset compressors
        run: sudo apt-get update -qq && sudo apt-get install -y brotli zstd

      - name: Build live Anubis
        working-directory: target/anubis-live
        run: |
          npm ci --ignore-scripts
          RUSTUP_TOOLCHAIN=1.99.0 npm run assets
          go build -o ../anubis-live-bin ./cmd/anubis

      - name: Build challenge-disasterer and E2E wrapper
        run: |
          # Public sccache artifacts are reused across heterogeneous GitHub runner CPUs.
          # Avoid host-specific build-script executables; accelerated ISA paths remain
          # always available on pinned nightly, even in CPU-only builds.
          cargo build --locked --release --no-default-features
          cargo build --locked --manifest-path tools/anubis-e2e/Cargo.toml

      - name: Exercise solver against live Anubis
        run: |
          target/debug/challenge-disasterer-anubis-e2e \
            --anubis-bin target/anubis-live-bin \
            --solver-bin target/release/challenge-disasterer \
            --fuzz \
            --fuzz-repeats 2 \
            --browser-reference=false

      - name: Finalize canonical sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@47a06568cde470da42ae67a93c8e63966cce1fce # main
