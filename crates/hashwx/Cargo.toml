[package]
name = "challenge-hashwx"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[dependencies]
wasmtime = { version = "=50.0.0", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_code = "deny"
