[package]
name = "challenge-pow-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
cfg-if = "1.0"
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
pbkdf2 = { version = "0.13", features = ["hmac"] }
blake3 = { version = "1.8", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
semver = { version = "1.0", default-features = false, optional = true, features = ["serde"] }
generic-array = "=0.14.7"
wgpu = { version = "30.0.1", optional = true }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
futures-channel = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
cpufeatures = { version = "0.3", default-features = false }

[dev-dependencies]
bincode = "1.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

[features]
default = ["std", "runtime-dispatch"]
runtime-dispatch = []
gpu = ["std", "dep:wgpu", "dep:bytemuck", "dep:futures-channel"]
alloc = []
std = ["alloc"]
compare-64bit = []
adapter = ["alloc", "dep:serde", "dep:semver"]
json = ["adapter", "dep:serde_json"]
rayon = ["std", "dep:rayon"]
internals = []
